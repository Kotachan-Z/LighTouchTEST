[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit PN532 @ ^1.2.2

build_flags =
    -DCONFIG_NIMBLE_ENABLED=1
    -DARDUINO_USB_CDC_ON_BOOT=1
